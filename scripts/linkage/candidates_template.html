:root{
  color-scheme:light;
  --page:#eeece6; --surface:#f7f6f2; --surface-2:#e7e4dc;

  --green:#14523a; --green-2:#1e6a49; --gold:#b8912f; --gold-2:#c9a13f; --cream:#f2efe6;
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#12130f; --surface:#1a1b17; --surface-2:#24251f;
  --ink:#f3f1e9; --ink-2:#c7c3b6; --ink-3:#918d80;

*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}

.shell-in{max-width:1400px;margin:0 auto;padding:13px 32px;display:flex;align-items:center;gap:24px}
.brand{display:flex;align-items:center;gap:13px;cursor:pointer}
.brand .mk{width:38px;height:38px;color:var(--green);flex:none}
.brand .wm{font-family:'EB Garamond',serif;font-size:23px;line-height:1.05;color:var(--ink)}

.brand .sub{font-family:'Space Mono',monospace;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3);margin-top:1px}
nav.main{display:flex;gap:2px;margin-left:6px}
nav.main a{background:transparent;color:var(--ink-2);font:600 13.5px Archivo,sans-serif;padding:8px 14px;border-radius:2px;cursor:pointer}

.tabs{display:flex;gap:2px;margin-bottom:24px;flex-wrap:wrap}

<script>
const CAREER_COLORS={'PMLN':'#006400','PMLQ':'#52b452','PPP':'#1c1c1c','IND':'#b7b3a8','MQM':'#c245b8','ANP':'#e34948','PTI':'#7a1f3d','JUIF':'#c98500','MMA':'#a07207','PMLF':'#2a5bd7','BAP':'#5b7ba6','IPP':'#8a6d1a','JI':'#0e7a8a','TLP':'#444','GDA':'#7d5ba6','PkMAP':'#b04a2f','PML-Z':'#3f7d3f','AML':'#6b4b9e','APML':'#5e5e5e','MQM-H':'#8d3d87','BNP':'#2f6f6f','NP':'#946200','PMLJ':'#4e8d4e','PML-H':'#6a9a6a','JUP':'#a3652f','PNA':'#355e3b','IJI':'#2e8b57','PDA':'#3a3a3a','NONP':'#9a9484','PML(Qayyum)':'#6fae6f','JUI-H':'#b97a00','PAI':'#8a8a2f','TNFJ':'#5d4b8c','PAT':'#8c4a3f','JWP':'#4d6b53','Other':'#00a3c7'};
const DARK_OVR={'PPP':'#e4e1d8','IND':'#8f8b80','PDA':'#d8d5cc','NONP':'#7d7a70'};
const CYEARS=[1977,1985,1988,1990,1993,1997,2002,2008,2013,2018,2024];
const REL_STYLE={'father-son':{d:null,w:2.4},'father-daughter':{d:null,w:2.4},'mother-son':{d:null,w:2.4},'mother-daughter':{d:null,w:2.4},'grandfather-grandson':{d:'10 4',w:2.4},'siblings':{d:'5 4',w:2},'spouses':{d:null,w:3.6},'cousins':{d:'2 4',w:1.7},'uncle-nephew':{d:'8 3 2 3',w:1.7},'aunt-nephew':{d:'8 3 2 3',w:1.7},'in-laws':{d:'1 4',w:1.4}};
const C=window.CAREER, DYN=window.DYN, PEOPLE=window.PEOPLE;
const PIDX=Object.entries(PEOPLE).map(([id,x])=>[id,x.n.toLowerCase()]);
function isDark(){return document.documentElement.dataset.theme==='dark'||(!document.documentElement.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);}
function ccol(p){return (isDark()&&DARK_OVR[p])?DARK_OVR[p]:(CAREER_COLORS[p]||CAREER_COLORS.Other);}
function cfg(p){return p==='IND'?(isDark()?'#12110f':'#12110f'):'#fff';}
const state={tab:'overview',fam:0,q:'',person:null};
const tip=document.getElementById('tip');
function showTip(h,e){tip.innerHTML=h;tip.style.display='block';tip.style.left=Math.min(e.clientX+14,innerWidth-300)+'px';tip.style.top=Math.min(e.clientY+14,innerHeight-120)+'px';}
function hideTip(){tip.style.display='none';}

// ---- bar chart (returns svg markup + binds after) ----
let chartTipData=[];
function chartSVG(rows,fmt,color,idPrefix){
  const W=620,H=200,P={l:42,r:8,t:16,b:28};
  const max=Math.max.apply(null,rows.map(r=>r[1]))*1.14||1;
  const bw=(W-P.l-P.r)/rows.length;
  let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  const mono='font-family:\'Space Mono\',monospace;';
  for(let g=0;g<=4;g++){const v=max*g/4,y=H-P.b-(H-P.t-P.b)*g/4;
    s+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line-2)"/>`;
    s+=`<text x="${P.l-6}" y="${y+4}" text-anchor="end" style="${mono}fill:var(--ink-3);font-size:11px">${fmt(v)}</text>`;}
  rows.forEach((r,i)=>{const bh=(H-P.t-P.b)*r[1]/max,x=P.l+bw*i+bw*0.2,bwid=bw*0.6,y=H-P.b-bh,cxp=x+bwid/2;
    s+=`<rect x="${x}" y="${y}" width="${bwid}" height="${bh}" fill="${color}" data-tip="${idPrefix}-${i}"/>`;
    s+=`<text x="${cxp}" y="${H-10}" text-anchor="middle" style="${mono}fill:var(--ink-3);font-size:11px">${r[0]}</text>`;
    s+=`<text x="${cxp}" y="${y-6}" text-anchor="middle" style="${mono}fill:var(--ink);font-size:12px;font-weight:700">${fmt(r[1])}</text>`;
    chartTipData[idPrefix+'-'+i]=r[2]||'';});
  s+='</svg>'; return s;
}
function bindChartTips(root){root.querySelectorAll('[data-tip]').forEach(el=>{el.addEventListener('mousemove',e=>{const t=chartTipData[el.getAttribute('data-tip')];if(t)showTip(t,e);});el.addEventListener('mouseleave',hideTip);});}

// ---- dynasty force graph ----
const graphCache={};
function graph(f,i){
  if(graphCache[i]) return graphCache[i];
  const gw=Math.min(700,Math.max(420,f.nodes.length*80)), gh=Math.max(300,f.nodes.length*32+110);
  const N=f.nodes.map((n,j)=>({...n,x:gw/2+Math.cos(j*2.4)*gw/4,y:gh/2+Math.sin(j*2.4)*gh/4,vx:0,vy:0}));
  const idx={}; N.forEach((n,j)=>idx[n.id]=j);
  const E=f.edges.filter(e=>idx[e.a]!=null&&idx[e.b]!=null);
  for(let it=0;it<420;it++){
    for(let a=0;a<N.length;a++)for(let b=a+1;b<N.length;b++){let dx=N[b].x-N[a].x,dy=N[b].y-N[a].y,d2=dx*dx+dy*dy||1,d=Math.sqrt(d2);const rep=2600/d2,fx=dx/d*rep,fy=dy/d*rep;N[a].vx-=fx;N[a].vy-=fy;N[b].vx+=fx;N[b].vy+=fy;}
    E.forEach(e=>{const a=N[idx[e.a]],b=N[idx[e.b]];let dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;const k=(d-108)*0.02,fx=dx/d*k,fy=dy/d*k;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;});
    N.forEach(n=>{n.vx+=(gw/2-n.x)*0.003;n.vy+=(gh/2-n.y)*0.003;n.x+=n.vx*=0.82;n.y+=n.vy*=0.82;n.x=Math.max(48,Math.min(gw-48,n.x));n.y=Math.max(34,Math.min(gh-28,n.y));});
  }
  const dom=p=>{const l=(p||'').split('|').filter(x=>x&&x!=='IND');return l.length?l[l.length-1]:'IND';};
  let s=`<svg width="${gw}" height="${gh}" viewBox="0 0 ${gw} ${gh}" style="max-width:100%;height:auto">`;
  const tips=[];
  E.forEach((e,j)=>{const a=N[idx[e.a]],b=N[idx[e.b]],st=REL_STYLE[e.rel]||{d:null,w:1.4};
    s+=`<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="#8d8a80" stroke-width="${st.w}"${st.d?` stroke-dasharray="${st.d}"`:''} data-gt="e${j}"/>`;
    tips['e'+j]=`<b>${e.rel}</b> · ${a.name} — ${b.name}${e.note?'<br>'+e.note:''}`;});
  N.forEach((n,j)=>{const r=8+Math.min(15,n.wins*2.3);
    s+=`<g data-gt="n${j}"><circle cx="${n.x}" cy="${n.y}" r="${r}" fill="${ccol(dom(n.parties))}" stroke="var(--surface)" stroke-width="2"/><text x="${n.x}" y="${n.y-r-6}" text-anchor="middle" style="fill:var(--ink);font-family:Archivo,sans-serif;font-size:11px;font-weight:600">${n.name.length>24?n.name.slice(0,22)+'…':n.name}</text></g>`;
    tips['n'+j]=`<b>${n.name}</b><br>${n.wins} wins · ${(n.years||'—').split('|').join(', ')}<br>${(n.parties||'').split('|').join(', ')}`;});
  s+='</svg>';
  graphCache[i]={svg:s,tips}; return graphCache[i];
}

// ---- tabs ----
const TABS=[['overview','Overview'],['longest','Longest careers'],['switching','Party switching'],['dynasties','Dynasties'],['search','Search']];
function renderTabs(){const el=document.getElementById('tabs');el.innerHTML='';TABS.forEach(([k,l])=>{const b=document.createElement('button');b.textContent=l;if(state.tab===k)b.className='on';b.onclick=()=>{state.tab=k;renderBody();};el.appendChild(b);});}
function renderTiles(){document.getElementById('tiles').innerHTML=window.TILES.map(t=>`<div class="t"><div class="v">${t[0]}</div><div class="l">${t[1]}</div></div>`).join('');}

function renderBody(){
  renderTabs();
  const b=document.getElementById('tabbody');
  if(state.tab==='overview') return overview(b);
  if(state.tab==='longest') return longest(b);
  if(state.tab==='switching') return switching(b);
  if(state.tab==='dynasties') return dynasties(b);
  if(state.tab==='search') return search(b);
}

function overview(b){
  const tv=C.turnover;
  const yy=y=>"\u2019"+String(y).slice(2);
  const trows=Object.keys(tv).map(k=>{const[a,c]=k.split('-');return [yy(a)+'\u2192'+yy(c),tv[k].reelection_rate,`${k}: ${tv[k].rewon} of ${tv[k].ran_again} incumbents who ran again won`];});
  const sp=C.switch_pairs;
  const adjacent=['1988-1990','1990-1993','1993-1997','1997-2002','2002-2008','2008-2013','2013-2018','2018-2024'];
  const srows=adjacent.map(k=>{const[a,c]=k.split('-');return [yy(a)+'\u2192'+yy(c),sp[k]||0,`${sp[k]||0} candidates changed label ${k.replace('-',' \u2192 ')}`];});
  // ---- cohort machinery (computed once from PEOPLE) ----
  if(!window.__COHORT){
    const co={};
    for(const y of CYEARS) co[y]={win:[],};
    for(const pid in PEOPLE){const rows=PEOPLE[pid].c;const wy=new Set(),ry=new Set();
      for(const r of rows){ry.add(r[0]);if(r[6])wy.add(r[0]);}
      for(const y of wy) co[y].win.push(pid);
      PEOPLE[pid]._wy=wy;PEOPLE[pid]._ry=ry;}
    window.__COHORT=co;
  }
  const co=window.__COHORT;
  if(!state.cy) state.cy=2008;
  const Y=state.cy, cohort=co[Y].win, N=cohort.length;
  const later=CYEARS.filter(y=>y>Y);
  const curve=later.map(y2=>{let ran=0,won=0;for(const pid of cohort){if(PEOPLE[pid]._ry.has(y2))ran++;if(PEOPLE[pid]._wy.has(y2))won++;}return {y:y2,ran,won};});
  const last=curve[curve.length-1]||{ran:0,won:0};
  const yrbtns=CYEARS.filter(y=>y<2024).map(y=>`<button data-cy="${y}" style="border:1px solid var(--line);background:${y===Y?'var(--ink)':'var(--page)'};color:${y===Y?'var(--page)':'var(--ink-2)'};font:600 12.5px 'Space Mono',monospace;padding:5px 10px;border-radius:2px;cursor:pointer">${y}</button>`).join(' ');
  // survival curve svg
  const W=920,H=230,P={l:46,r:14,t:18,b:30};
  const xs=i=>P.l+(W-P.l-P.r)*(curve.length===1?0.5:i/(curve.length-1));
  const ys=v=>H-P.b-(H-P.t-P.b)*v/100;
  let sv=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">`;
  const mono="font-family:'Space Mono',monospace;";
  for(let g=0;g<=4;g++){const v=100*g/4,y=ys(v);
    sv+=`<line x1="${P.l}" x2="${W-P.r}" y1="${y}" y2="${y}" stroke="var(--line-2)"/><text x="${P.l-6}" y="${y+4}" text-anchor="end" style="${mono}fill:var(--ink-3);font-size:11px">${v}%</text>`;}
  const path=(key)=>curve.map((c,i)=>`${i?'L':'M'}${xs(i)},${ys(100*c[key]/Math.max(1,N))}`).join('');
  sv+=`<path d="${path('won')} L${xs(curve.length-1)},${ys(0)} L${xs(0)},${ys(0)} Z" fill="var(--green)" opacity="0.12"/>`;
  sv+=`<path d="${path('ran')}" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-dasharray="5 4"/>`;
  sv+=`<path d="${path('won')}" fill="none" stroke="var(--green)" stroke-width="2.6"/>`;
  curve.forEach((c,i)=>{
    sv+=`<circle cx="${xs(i)}" cy="${ys(100*c.ran/Math.max(1,N))}" r="4.5" fill="var(--gold)" data-tip="cv-r${i}"/>`;
    sv+=`<circle cx="${xs(i)}" cy="${ys(100*c.won/Math.max(1,N))}" r="4.5" fill="var(--green)" data-tip="cv-w${i}"/>`;
    sv+=`<text x="${xs(i)}" y="${H-10}" text-anchor="middle" style="${mono}fill:var(--ink-3);font-size:11px">${c.y}</text>`;
    chartTipData['cv-r'+i]=`<b>${c.y}</b>: ${c.ran} of the ${N} winners of ${Y} were on the ballot (${Math.round(100*c.ran/Math.max(1,N))}%)`;
    chartTipData['cv-w'+i]=`<b>${c.y}</b>: ${c.won} of the ${N} winners of ${Y} won again (${Math.round(100*c.won/Math.max(1,N))}%)`;});
  sv+='</svg>';
  // fresh faces + career length
  const DYNSET=window.__DYNSET||(window.__DYNSET=new Set(DYN.flatMap(f=>f.nodes.map(n=>n.id))));
  const fresh=CYEARS.slice(1).map(y=>{let nw=0,tot=0;for(const pid of co[y].win){tot++;let seen=false;for(const r of PEOPLE[pid].c){if(r[0]<y){seen=true;break;}}if(!seen&&!DYNSET.has(pid))nw++;}
    return [yy(y),tot?nw/tot:0,`${y}: ${nw} of ${tot} winners had never contested a GE before (within 1977–2024 data)`];});
  const clen={};
  for(const pid in PEOPLE){const k=Math.min(5,PEOPLE[pid]._ry.size);clen[k]=(clen[k]||0)+1;}
  const crows=[1,2,3,4,5].map(k=>[k===5?'5+':String(k),clen[k]||0,`${(clen[k]||0).toLocaleString()} people contested ${k===5?'five or more':k} general election${k>1?'s':''}`]);
  chartTipData=chartTipData||{};
  b.innerHTML=`<div class="grid2">
    <div class="card" style="flex:1 1 100%"><h2>Where is the class of ${Y}?</h2>
      <p class="desc" style="max-width:80ch">Pick an assembly. Of the <b>${N}</b> general-seat winners of ${Y}, the gold dashed line tracks how many were still <b>on the ballot</b> at each later election; the green line, how many made it <b>back into the House</b>. By 2024: <b>${(curve.find(c=>c.y===2024)||{ran:0}).ran}</b> on the ballot, <b>${(curve.find(c=>c.y===2024)||{won:0}).won}</b> in the assembly. Shares are of the <b>whole class</b>, including those who never stood again — unconditional survival, unlike the re-election rate below, which conditions on running. Record linkage is deliberately conservative across the pre-1993 source seam, so these survival counts are a floor.</p>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">${yrbtns}</div>${sv}</div>
    <div class="card half"><h2>Incumbent re-election rate</h2><p class="desc">Of winners who <b>contested</b> the next general election, the share who won again — retirement, death and disqualification are filtered out before the vote. That is why this sits well above the survival curve: 94 of all 263 winners of 2018 reached the 2024 House (36%), but 94 of the 160 who stood (59%). The gap is attrition before the ballot, not defeat at it. The collapse into 2002 owes as much to Musharraf-era eligibility rules and exiled leaderships as to voters; 2024 cut the other way against PTI. The 1977→1985 pair spans the coup, Bhutto's execution and an eight-year gap.</p>${chartSVG(trows,x=>Math.round(x*100)+'%','#14523a','tv')}</div>
    <div class="card half"><h2>Candidates who changed label</h2><p class="desc">The same person contesting consecutive elections under different party names. 1985 is excluded (non-party). The 2024 figure is inflated by PTI candidates forced onto independent tickets after the party lost its symbol.</p>${chartSVG(srows,x=>Math.round(x),'#b8912f','sp')}</div>
    <div class="card half"><h2>Fresh faces in each assembly</h2><p class="desc">Share of winners with no earlier general-election candidacy in the data and no verified-family membership (dynastic first-timers stay in the denominator). Early years are inflated by the window edge — a 1985 "newcomer" may have a pre-1977 career; sparse 1993/1997 candidate files also overstate novelty.</p>${chartSVG(fresh,x=>Math.round(x*100)+'%','#1e6a49','ff')}</div>
    <div class="card half"><h2>How long do careers last?</h2><p class="desc">Number of general elections each linked person contested, 1977–2024. Most candidacies are one-off; the House is renewed from a thin persistent class.</p>${chartSVG(crows,x=>x>=1000?(x/1000).toFixed(1)+'k':Math.round(x),'#6a675e','cl')}</div>
  </div>`;
  bindChartTips(b);
  b.querySelectorAll('[data-cy]').forEach(el=>el.onclick=()=>{state.cy=+el.dataset.cy;renderBody();});
}
function longest(b){
  const rows=C.longest.map((d,i)=>{
    const by={}; d.seq.forEach(s=>by[s.year]=s);
    const tl=CYEARS.map(y=>{const s=by[y];if(!s)return `<i style="background:transparent;border:1.5px solid var(--line-2);opacity:.5"></i>`;
      const col=ccol(s.party);return `<i style="background:${s.outcome==='Win'?col:'transparent'};border:1.5px solid ${col}" data-yr="${y}" data-na="${s.na}" data-c="${(s.constituency||'').replace(/"/g,'')}" data-party="${s.party}" data-out="${s.outcome}"></i>`;}).join('');
    const badges=(d.parties||[]).filter(p=>p).map(p=>`<span class="badge" style="background:${ccol(p)};color:${cfg(p)}">${p}</span>`).join('');
    return `<tr><td class="mono" style="color:var(--ink-3)">${i+1}</td><td style="font-weight:600">${d.name}</td><td class="mono" style="font-weight:700">${d.ge_wins}</td><td><span class="tl">${tl}</span></td><td>${badges}</td></tr>`;
  }).join('');
  b.innerHTML=`<div class="card"><h2>Most general-election wins</h2><p class="desc">A filled cell is a seat won that year, coloured by party; an outline is a contest lost; a faint cell means they did not stand. Counted inside this window only — careers before 1977, by-elections and reserved seats are invisible here. 1985 was a non-party election: candidacies that year carry the grey NONP label.</p>
  <table class="ct"><tr><th>#</th><th>Name</th><th>Wins</th><th>1977 → 2024</th><th>Parties</th></tr>${rows}</table></div>`;
  b.querySelectorAll('i[data-yr]').forEach(el=>{el.addEventListener('mousemove',e=>showTip(`${el.dataset.yr} · ${el.dataset.na} ${el.dataset.c}<br>${el.dataset.party} · ${el.dataset.out}`,e));el.addEventListener('mouseleave',hideTip);});
}

function switching(b){
  const loy=Object.entries(C.loyalty).sort((a,b)=>b[1].rate-a[1].rate).map(([p,x])=>`<div class="loy"><span class="badge" style="background:${ccol(p)};color:${cfg(p)};justify-self:start">${p}</span><div class="bar"><div style="width:${x.rate*100}%;background:${ccol(p)}"></div></div><span class="mono" style="font-size:12.5px">${Math.round(x.rate*100)}% <span style="color:var(--ink-3)">(${x.stay}/${x.total})</span></span></div>`).join('');
  const chip=f=>`<span class="chip"><span class="badge" style="background:${ccol(f[0])};color:${cfg(f[0])}">${f[0]}</span><span style="color:var(--ink-3)">→</span><span class="badge" style="background:${ccol(f[1])};color:${cfg(f[1])}">${f[1]}</span><b class="mono">×${f[2]}</b></span>`;
  b.innerHTML=`<div class="grid2">
    <div class="card" style="flex:1 1 420px"><h2>Party retention</h2><p class="desc">Among candidates who contested consecutive elections under a party, the share who stayed. The non-party 1985 election is excluded throughout this tab. MMA, JI and JUI-F churn is alliance mechanics rather than defection — and the 2018→2024 PTI→IND flood is the January 2024 symbol ruling, candidates who kept their allegiance but lost the label, not defection.</p>${loy}</div>
    <div class="card" style="flex:1 1 420px"><h2>Most travelled routes</h2><p class="desc">Every switch between consecutive elections, counted by direction.</p><div>${C.top_all_switches.map(chip).join('')}</div>
    <div class="k" style="font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 10px">Followed by a win</div><div>${C.top_win_switches.map(chip).join('')}</div></div>
  </div>`;
}

function dynasties(b){
  const list=DYN.map((f,i)=>`<div class="famrow" data-i="${i}" style="background:${i===state.fam?'var(--page)':'transparent'}"><div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline"><span class="fn">${f.family}</span><span class="fw">${f.total_wins} wins</span></div><div class="fb">${f.base} · ${f.nodes.length} members · ${f.edges.length} ties</div></div>`).join('');
  const f=DYN[state.fam]; const g=graph(f,state.fam);
  const rels=f.edges.map(e=>{const a=(f.nodes.find(n=>n.id===e.a)||{}).name,bn=(f.nodes.find(n=>n.id===e.b)||{}).name;return `<div style="font-size:13px;line-height:1.5"><b>${a}</b> — <b>${bn}</b> · <span class="mono" style="font-size:12px;color:var(--green)">${e.rel}</span>${e.note?' · '+e.note:''} ${e.src?`<a href="${e.src}" target="_blank" rel="noopener" style="font-size:11.5px;text-decoration:underline">source</a>`:''}</div>`;}).join('');
  b.innerHTML=`<p class="desc" style="max-width:82ch;margin-bottom:18px">Clusters were found by rare surname tokens shared inside a district, then every relationship was checked one at a time against published sources. Only sourced ties are drawn. Node size is wins in this window; colour is the party the member stood for most often.</p>
  <div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
    <div class="famlist">${list}</div>
    <div class="card" style="flex:1 1 520px"><div style="font-family:'EB Garamond',serif;font-size:28px">${f.family}</div><div style="font-size:12.5px;color:var(--ink-3)">${f.base}</div><p class="desc" style="margin:10px 0 6px;max-width:70ch">${f.notes||''}</p><div style="overflow-x:auto" id="famgraph">${g.svg}</div><div style="display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line-2);padding-top:14px;margin-top:8px">${rels}</div></div>
  </div>`;
  b.querySelectorAll('.famrow').forEach(rw=>rw.onclick=()=>{state.fam=+rw.dataset.i;renderBody();});
  const gg=document.getElementById('famgraph');
  gg.querySelectorAll('[data-gt]').forEach(el=>{el.addEventListener('mousemove',e=>{const t=g.tips[el.getAttribute('data-gt')];if(t)showTip(t,e);});el.addEventListener('mouseleave',hideTip);});
}

function search(b){
  b.innerHTML=`<div class="card"><h2>Find a candidate</h2><p class="desc" style="max-width:70ch">Every NA candidacy from 1977 to 2024, linked across spelling variants. Cross-era links over long gaps (a 1980s name reappearing after 2002) are made only on strong evidence — treat any remaining implausibly long careers with suspicion. Names are matched by transliteration and geography, so very common short names can conflate two people — treat implausibly long careers with suspicion.</p>
  <input class="searchbox" id="q" type="search" placeholder="Khursheed Shah, Bilour, Leghari…" value="${state.q.replace(/"/g,'&quot;')}">
  <div id="hits" style="margin-top:14px"></div><div id="person" style="margin-top:22px"></div></div>`;
  const q=document.getElementById('q');q.oninput=()=>{state.q=q.value;state.person=null;renderHits();renderPerson();};
  q.focus();renderHits();renderPerson();
}
function renderHits(){const el=document.getElementById('hits');if(!el)return;const q=(state.q||'').trim().toLowerCase();if(q.length<3){el.innerHTML='';return;}
  const hits=PIDX.filter(x=>x[1].includes(q)).slice(0,40);
  el.innerHTML=hits.map(x=>{const p=PEOPLE[x[0]];return `<div class="hit" data-id="${x[0]}"><b>${p.n}</b> <span class="mono" style="font-size:12px;color:var(--ink-3)">${p.c.length} candidacies · ${p.w} wins</span></div>`;}).join('');
  el.querySelectorAll('.hit').forEach(h=>h.onclick=()=>{state.person=h.dataset.id;renderPerson();});}
function renderPerson(){const el=document.getElementById('person');if(!el)return;if(!state.person||!PEOPLE[state.person]){el.innerHTML='';return;}
  const p=PEOPLE[state.person];
  const rows=p.c.map(x=>`<tr><td class="mono">${x[0]}</td><td class="mono">${x[1]}</td><td style="color:var(--ink-3)">${x[2]}</td><td><span class="badge" style="background:${ccol(x[3])};color:${cfg(x[3])}">${x[3]}</span></td><td class="mono" style="text-align:right">${(+x[4]||0).toLocaleString()}</td><td class="mono" style="text-align:right">${x[5]}</td><td>${x[6]?'Win':'Loss'}</td></tr>`).join('');
  el.innerHTML=`<div style="font-family:'EB Garamond',serif;font-size:26px">${p.n}</div><table class="ct" style="margin-top:8px"><tr><th>Year</th><th>Seat</th><th>District</th><th>Party</th><th>Votes</th><th>Rank</th><th>Result</th></tr>${rows}</table>`;}

document.getElementById('theme').onclick=()=>{const cur=document.documentElement.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');const nx=cur==='dark'?'light':'dark';document.documentElement.dataset.theme=nx;try{localStorage.setItem('aej-theme',nx);}catch(e){}for(const k in graphCache)delete graphCache[k];renderBody();};
try{const s=localStorage.getItem('aej-theme');if(s)document.documentElement.dataset.theme=s;}catch(e){}
(function(){const t=new URLSearchParams(location.search).get('tab');if(t&&TABS.some(x=>x[0]===t))state.tab=t;})();
renderTiles();renderBody();
</script>
